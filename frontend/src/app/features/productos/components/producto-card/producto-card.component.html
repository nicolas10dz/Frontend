<article class="card">
  <div class="card__media">
    @if (producto().imagenUrl) {
      <img class="card__imagen" [src]="producto().imagenUrl" [alt]="producto().nombre" />
    } @else {
      <span class="card__inicial" aria-hidden="true">{{ producto().nombre.slice(0, 1) }}</span>
    }
  </div>

  <div class="card__cuerpo">
    <div class="card__cabecera">
      <h3 class="card__nombre">{{ producto().nombre }}</h3>
      <app-estado-stock [stock]="producto().stock" />
    </div>

    @if (producto().categoria) {
      <p class="card__categoria">{{ producto().categoria }}</p>
    }

    <p class="card__descripcion">{{ producto().descripcion }}</p>

    <div class="card__pie">
      <div class="card__datos">
        <span class="card__precio">{{ precioFormateado() }}</span>
        <span class="card__stock">{{ producto().stock }} unidades</span>
      </div>
      <div class="card__acciones">
        <a class="btn" [routerLink]="['/productos', producto().id]">Ver</a>
        <button type="button" class="btn btn--peligro" (click)="eliminar.emit(producto())">
          Eliminar
        </button>
      </div>
    </div>
  </div>
</article>
